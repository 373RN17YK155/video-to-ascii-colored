<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Цветной ASCII-арт из видео</title>
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,400;0,500&display=swap"
      rel="stylesheet"
    />
    <style>
      body { background: #000; margin: 0; padding: 0; overflow: hidden; }
      video { display: block; max-width: 0; max-height: 0; }
      canvas { display: block; }
    </style>
  </head>
  <body>
    <canvas></canvas>
    <video autoplay="true" muted></video>
    <script>
      const canvas = document.querySelector("canvas");
      const ctx = canvas.getContext("2d", { willReadFrequently: true });
      ctx.imageSmoothingEnabled = false;
      ctx.font = '12px JetBrains Mono, monospace';
      ctx.textBaseline = 'top';

      const density = "@%#*+=-:.";
      const densityLen = density.length;

      const video = document.querySelector("video");

      let cols = 0;
      let rows = 0;
      let imageData = null;

      function initCanvas() {
        const newCols = Math.floor(window.innerWidth / 10);
        const newRows = Math.floor(window.innerHeight / 10);

        if (newCols === cols && newRows === rows) return;

        cols = newCols;
        rows = newRows;
        canvas.width = cols * 10;
        canvas.height = rows * 10;

        imageData = ctx.createImageData(cols, rows);
      }

      initCanvas();

      new ResizeObserver(() => {
        initCanvas();
      }).observe(document.body);

      if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
        navigator.mediaDevices
          .getUserMedia({ video: true })
          .then(function (stream) {
            video.srcObject = stream;
            video.play();
          })
          .then(() => {
            ctx.drawImage(video, 0, 0, cols, rows);
            ctx.getImageData(0, 0, cols, rows, imageData);
            updateAscii(imageData);
          })
          .catch(function (error) {
            console.error("Ошибка камеры:", error);
          });
      }

      function updateAscii(imageData) {
        const data = imageData.data;
        const width = cols;
        const height = rows;

        ctx.fillStyle = '#000';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        for (let y = 0; y < height; y++) {
          for (let x = 0; x < width; x++) {
            const i = (y * width + x) * 4;
            const avg = (data[i] + data[i + 1] + data[i + 2]) / 3;
            const charIdx = ((255 - avg) / 255 * (densityLen - 1)) | 0;

            ctx.fillStyle = `rgb(${data[i]},${data[i+1]},${data[i+2]})`;
            ctx.fillText(density[charIdx], x * 10, y * 10);
          }
        }
      }

      let animationId;

      function loop() {
        if (!video.paused && !video.ended) {
          ctx.drawImage(video, 0, 0, cols, rows);
          ctx.getImageData(0, 0, cols, rows, imageData);
          updateAscii(imageData);
          animationId = requestAnimationFrame(loop);
        }
      }

      video.addEventListener("play", () => loop(), 0);
      video.addEventListener("pause", () => cancelAnimationFrame(animationId));
      video.addEventListener("ended", () => cancelAnimationFrame(animationId));
    </script>
  </body>
</html>
