<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Цветной ASCII-арт из видео</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
    <style>
      body { background: #000; margin: 0; padding: 0; overflow: hidden; }
      canvas, video { display: block; width: 100vw; height: 100vh; }
    </style>
  </head>
  <body>
    <canvas id="display"></canvas>
    <canvas id="capture" style="display:none"></canvas>
    <video autoplay="true" muted playsinline></video>
    <script>
      const captureCanvas = document.getElementById("capture");
      const captureCtx = captureCanvas.getContext("2d", { willReadFrequently: true });
      captureCtx.imageSmoothingEnabled = false;

      const displayCanvas = document.getElementById("display");
      const displayCtx = displayCanvas.getContext("2d");
      displayCtx.imageSmoothingEnabled = false;

      const density = "@%#*+=-:.";
      const densityLen = density.length;
      const scale = 12;

      const video = document.querySelector("video");

      let cols = 0;
      let rows = 0;
      let asciiText = "";

      function initCanvas() {
        cols = Math.floor(window.innerWidth / scale);
        rows = Math.floor(window.innerHeight / scale);
        displayCanvas.width = cols * scale;
        displayCanvas.height = rows * scale;
        captureCanvas.width = 640;
        captureCanvas.height = 480;
        
        displayCtx.font = `${scale}px 'JetBrains Mono', monospace`;
        displayCtx.textBaseline = 'top';
      }

      initCanvas();

      new ResizeObserver(() => {
        initCanvas();
      }).observe(document.body);

      if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
        navigator.mediaDevices
          .getUserMedia({ video: true })
          .then(function (stream) {
            video.srcObject = stream;
          })
          .catch(function (error) {
            console.error("Ошибка камеры:", error);
          });
      }

      function updateAscii() {
        try {
          captureCtx.drawImage(video, 0, 0, captureCanvas.width, captureCanvas.height);
        } catch (e) {
          console.error("drawImage error:", e);
          return;
        }
        
        let data;
        try {
          data = captureCtx.getImageData(0, 0, captureCanvas.width, captureCanvas.height).data;
        } catch (e) {
          console.error("getImageData error (canvas tainted):", e);
          return;
        }
        
        const srcWidth = captureCanvas.width;
        const srcHeight = captureCanvas.height;
        const stepX = srcWidth / cols;
        const stepY = srcHeight / rows;

        displayCtx.fillStyle = '#000';
        displayCtx.fillRect(0, 0, displayCanvas.width, displayCanvas.height);

        for (let y = 0; y < rows; y++) {
          for (let x = 0; x < cols; x++) {
            const srcX = (x * stepX) | 0;
            const srcY = (y * stepY) | 0;
            const i = (srcY * srcWidth + srcX) * 4;

            const r = data[i];
            const g = data[i + 1];
            const b = data[i + 2];
            const avg = (r + g + b) / 3;
            const charIdx = ((255 - avg) / 255 * (densityLen - 1)) | 0;

            displayCtx.fillStyle = `rgb(${r},${g},${b})`;
            displayCtx.fillText(density[charIdx], x * scale, y * scale);
          }
        }
      }

      function loop() {
        if (video.readyState >= 2) {
          updateAscii();
        }
        requestAnimationFrame(loop);
      }

      video.addEventListener("playing", () => loop());
    </script>
  </body>
</html>
