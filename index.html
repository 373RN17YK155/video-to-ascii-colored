<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Цветной ASCII-арт из видео</title>
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,400;0,500&display=swap"
      rel="stylesheet"
    />
    <style>
      body { background: #000; margin: 0; padding: 0; overflow: hidden; }
      video { display: block; max-width: 0; max-height: 0; }
      canvas { display: block; }
    </style>
  </head>
  <body>
    <canvas></canvas>
    <video autoplay="true" muted playsinline></video>
    <script>
      const canvas = document.querySelector("canvas");
      const ctx = canvas.getContext("2d", { willReadFrequently: true });
      ctx.imageSmoothingEnabled = false;
      ctx.font = '12px JetBrains Mono, monospace';
      ctx.textBaseline = 'top';

      const density = "@%#*+=-:.";
      const densityLen = density.length;

      const video = document.querySelector("video");

      let cols = 0;
      let rows = 0;

      function initCanvas() {
        const newCols = Math.floor(window.innerWidth / 10);
        const newRows = Math.floor(window.innerHeight / 10);

        if (newCols === cols && newRows === rows) return;

        cols = newCols;
        rows = newRows;
        canvas.width = cols * 10;
        canvas.height = rows * 10;
      }

      initCanvas();

      new ResizeObserver(() => {
        initCanvas();
      }).observe(document.body);

      if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
        navigator.mediaDevices
          .getUserMedia({ video: true })
          .then(function (stream) {
            video.srcObject = stream;
          })
          .catch(function (error) {
            console.error("Ошибка камеры:", error);
          });
      }

      function loop() {
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        requestAnimationFrame(loop);
      }

      video.addEventListener("playing", () => loop());
    </script>
  </body>
</html>
