<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Цветной ASCII-арт из видео</title>
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,400;0,500&display=swap"
      rel="stylesheet"
    />
    <style>
      body { background: #000; margin: 0; padding: 0; overflow: hidden; }
      video { display: block; max-width: 0; max-height: 0; }
      canvas { display: block; }
    </style>
  </head>
  <body>
    <canvas></canvas>
    <video autoplay="true" muted playsinline></video>
    <script>
      const canvas = document.querySelector("canvas");
      const ctx = canvas.getContext("2d", { willReadFrequently: true });
      ctx.imageSmoothingEnabled = false;

      const density = "@%#*+=-:.";
      const densityLen = density.length;
      const scale = 12;

      const video = document.querySelector("video");

      let cols = 0;
      let rows = 0;

      function initCanvas() {
        const newCols = Math.floor(window.innerWidth / scale);
        const newRows = Math.floor(window.innerHeight / scale);

        if (newCols === cols && newRows === rows) return;

        cols = newCols;
        rows = newRows;
        canvas.width = cols * scale;
        canvas.height = rows * scale;
        
        ctx.font = `${scale}px monospace`;
        ctx.textBaseline = 'top';
      }

      initCanvas();

      new ResizeObserver(() => {
        initCanvas();
      }).observe(document.body);

      if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
        navigator.mediaDevices
          .getUserMedia({ video: true })
          .then(function (stream) {
            video.srcObject = stream;
          })
          .catch(function (error) {
            console.error("Ошибка камеры:", error);
          });
      }

      function updateAscii() {
        const srcWidth = video.videoWidth;
        const srcHeight = video.videoHeight;
        
        ctx.drawImage(video, 0, 0);
        
        const stepX = srcWidth / cols;
        const stepY = srcHeight / rows;

        ctx.fillStyle = '#000';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        for (let y = 0; y < rows; y++) {
          for (let x = 0; x < cols; x++) {
            const srcX = (x * stepX) | 0;
            const srcY = (y * stepY) | 0;
            const data = ctx.getImageData(srcX, srcY, 1, 1).data;

            const r = data[0];
            const g = data[1];
            const b = data[2];
            const avg = (r + g + b) / 3;
            const charIdx = ((255 - avg) / 255 * (densityLen - 1)) | 0;

            ctx.fillStyle = `rgb(${r},${g},${b})`;
            ctx.fillText(density[charIdx], x * scale, y * scale);
          }
        }
      }

      function loop() {
        if (video.readyState >= 2) {
          updateAscii();
        }
        requestAnimationFrame(loop);
      }

      video.addEventListener("playing", () => loop());
    </script>
  </body>
</html>
