<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Цветной ASCII-арт из видео</title>
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,400;0,500&display=swap"
      rel="stylesheet"
    />
    <style>
      body { background: #000; margin: 0; padding: 0; overflow: hidden; }
      canvas, video { display: block; max-width: 0; max-height: 0; }
      #ascii {
        font-family: monospace;
        font-size: 12px;
        line-height: 1;
        letter-spacing: 0;
        white-space: pre;
        background: #000;
        color: #0f0;
        position: absolute;
        inset: 0;
      }
    </style>
  </head>
  <body>
    <canvas id="capture" style="display:none"></canvas>
    <video autoplay="true" muted playsinline></video>
    <div id="ascii"></div>
    <script>
      const captureCanvas = document.getElementById("capture");
      const captureCtx = captureCanvas.getContext("2d", { willReadFrequently: true });
      captureCtx.imageSmoothingEnabled = false;

      const asciiDiv = document.getElementById("ascii");

      const density = "@%#*+=-:.";
      const densityLen = density.length;
      const scale = 12;

      const video = document.querySelector("video");

      let cols = 0;
      let rows = 0;
      let spanPool = [];

      function initCanvas() {
        const newCols = Math.floor(window.innerWidth / scale);
        const newRows = Math.floor(window.innerHeight / scale);

        if (newCols === cols && newRows === rows) return;

        cols = newCols;
        rows = newRows;
        captureCanvas.width = 640;
        captureCanvas.height = 480;

        const totalSpans = cols * rows;

        if (spanPool.length < totalSpans) {
          const toAdd = totalSpans - spanPool.length;
          const fragment = document.createDocumentFragment();
          for (let i = 0; i < toAdd; i++) {
            const span = document.createElement("span");
            spanPool.push(span);
            fragment.appendChild(span);
          }
          asciiDiv.appendChild(fragment);
        }

        for (let i = 0; i < totalSpans; i++) {
          spanPool[i].style.display = "inline";
        }
        for (let i = totalSpans; i < spanPool.length; i++) {
          spanPool[i].style.display = "none";
        }
      }

      initCanvas();

      new ResizeObserver(() => {
        initCanvas();
      }).observe(document.body);

      if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
        navigator.mediaDevices
          .getUserMedia({ video: true })
          .then(function (stream) {
            video.srcObject = stream;
          })
          .catch(function (error) {
            console.error("Ошибка камеры:", error);
          });
      }

      function updateAscii() {
        try {
          captureCtx.drawImage(video, 0, 0, captureCanvas.width, captureCanvas.height);
        } catch (e) {
          console.error("drawImage error:", e);
          return;
        }
        
        let data;
        try {
          data = captureCtx.getImageData(0, 0, captureCanvas.width, captureCanvas.height).data;
        } catch (e) {
          console.error("getImageData error (canvas tainted):", e);
          return;
        }
        
        console.log("Sample pixels:", data[0], data[1], data[2], data[3]);
        
        const srcWidth = captureCanvas.width;
        const srcHeight = captureCanvas.height;
        const stepX = srcWidth / cols;
        const stepY = srcHeight / rows;

        let poolIdx = 0;

        for (let y = 0; y < rows; y++) {
          for (let x = 0; x < cols; x++) {
            const srcX = (x * stepX) | 0;
            const srcY = (y * stepY) | 0;
            const i = (srcY * srcWidth + srcX) * 4;

            const r = data[i];
            const g = data[i + 1];
            const b = data[i + 2];
            const avg = (r + g + b) / 3;
            const charIdx = ((255 - avg) / 255 * (densityLen - 1)) | 0;

            const span = spanPool[poolIdx++];
            span.textContent = density[charIdx];
            span.style.color = `rgb(${r},${g},${b})`;
          }
        }
      }

      function loop() {
        if (video.readyState >= 2) {
          updateAscii();
        }
        requestAnimationFrame(loop);
      }

      video.addEventListener("playing", () => loop());
    </script>
  </body>
</html>
